openapi: 3.1.0
info:
  title: CatchKeep API
  version: 0.1.0
  description: >-
    Profile-scoped API for CatchKeep. Every trainer route derives the trainer
    from the session; trainer IDs never appear in paths or bodies.
servers:
  - url: /api/v1
security: []
tags:
  - name: system
    description: Host status.
  - name: profiles
    description: Trainer profiles on this host.
  - name: session
    description: Signing in to a profile with its PIN.
  - name: imports
    description: Bringing a collection in from an export, previewed before it is applied.
  - name: collection
    description: The signed-in trainer's Pokémon.
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Report whether the API is up.
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List the profiles on this host, for the profile picker.
      responses:
        "200":
          description: All profiles, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [profiles]
      operationId: createProfile
      summary: Create a trainer profile protected by a PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProfile"
      responses:
        "201":
          description: Profile created. The caller still has to sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /session:
    post:
      tags: [session]
      operationId: signIn
      summary: Sign in to a profile with its PIN.
      description: >-
        On success sets the session cookie. Signing in while signed in to
        another profile replaces that session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie (`ck_session`), HttpOnly and SameSite=Strict.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [session]
      operationId: signOut
      summary: Sign out of the current profile.
      security:
        - session: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: The profile the caller is signed in to.
      security:
        - session: []
      responses:
        "200":
          description: The signed-in profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports:
    post:
      tags: [imports]
      operationId: stageImport
      summary: Upload a Poke Genie CSV export and get a preview. Nothing changes until it is committed.
      security:
        - session: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "201":
          description: Staged. Review the preview, then commit it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [imports]
      operationId: getImport
      summary: The preview of a staged or committed import.
      security:
        - session: []
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [imports]
      operationId: commitImport
      summary: Add the staged Pokémon to the collection.
      description: >-
        Adds every new row. Rows that might be Pokémon already in the
        collection are held back for review and never merged automatically.
      security:
        - session: []
      responses:
        "200":
          description: Committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}/answers:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [imports]
      operationId: answerPossibleMatches
      summary: Answer whether held-back rows are Pokémon already collected.
      description: >-
        For each row, "same" names the candidate it is (its newer readings are
        added to that Pokémon on commit) and "different" adds it as a new
        Pokémon. A later answer for a row replaces the earlier one. All
        answers are applied, or none.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchAnswers"
      responses:
        "200":
          description: Answers saved; the updated preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /collection:
    get:
      tags: [collection]
      operationId: listCollection
      summary: Every active Pokémon of the signed-in trainer.
      security:
        - session: []
      responses:
        "200":
          description: The collection, strongest first (CP descending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ck_session
  schemas:
    ProfileId:
      type: string
      description: Stable profile identifier (ULID).
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      examples: [01JD2Z8Q4M8V7Y6X5W4T3S2R1P]
    DisplayName:
      type: string
      minLength: 1
      maxLength: 40
      examples: [Ash]
    Pin:
      type: string
      description: 4 to 8 digits.
      pattern: "^[0-9]{4,8}$"
      examples: ["2468"]
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: "#/components/schemas/ProfileId"
        displayName:
          $ref: "#/components/schemas/DisplayName"
    NewProfile:
      type: object
      additionalProperties: false
      required: [displayName, pin]
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
        pin:
          $ref: "#/components/schemas/Pin"
    SignIn:
      type: object
      additionalProperties: false
      required: [profileId, pin]
      properties:
        profileId:
          $ref: "#/components/schemas/ProfileId"
        pin:
          $ref: "#/components/schemas/Pin"
    Me:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: "#/components/schemas/ProfileId"
        displayName:
          $ref: "#/components/schemas/DisplayName"
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Backend build version.
          examples: [0.1.0]
    TriState:
      type: string
      description: >-
        Whether a feature is known to be present, known to be absent, or not
        established by any source yet. Unknown is never treated as absent.
      enum: [yes, no, unknown]
    Pokemon:
      type: object
      additionalProperties: false
      required: [id, species, form, attributes]
      properties:
        id:
          type: string
          description: >-
            Stable record id (ULID). A row of an import that is not collected
            yet has the id "row-N".
        species:
          type: string
          examples: [Metagross]
        form:
          type: string
          description: Form name; "Normal" for the default form.
          examples: [Normal]
        dexNumber:
          type: integer
          minimum: 1
        gender:
          type: string
          enum: [male, female]
        cp:
          type: integer
          minimum: 0
        hp:
          type: integer
          minimum: 0
        level:
          type: number
        iv:
          $ref: "#/components/schemas/IVs"
        catchDate:
          type: string
          format: date
        attributes:
          $ref: "#/components/schemas/Attributes"
    IVs:
      type: object
      additionalProperties: false
      required: [attack, defense, stamina]
      properties:
        attack:
          type: integer
          minimum: 0
          maximum: 15
        defense:
          type: integer
          minimum: 0
          maximum: 15
        stamina:
          type: integer
          minimum: 0
          maximum: 15
    Attributes:
      type: object
      additionalProperties: false
      required:
        [
          shiny,
          lucky,
          shadow,
          purified,
          favorite,
          costume,
          background,
          dynamax,
          gigantamax,
        ]
      properties:
        shiny:
          $ref: "#/components/schemas/TriState"
        lucky:
          $ref: "#/components/schemas/TriState"
        shadow:
          $ref: "#/components/schemas/TriState"
        purified:
          $ref: "#/components/schemas/TriState"
        favorite:
          $ref: "#/components/schemas/TriState"
        costume:
          $ref: "#/components/schemas/TriState"
        background:
          $ref: "#/components/schemas/TriState"
        dynamax:
          $ref: "#/components/schemas/TriState"
        gigantamax:
          $ref: "#/components/schemas/TriState"
    Collection:
      type: object
      additionalProperties: false
      required: [total, pokemon]
      properties:
        total:
          type: integer
          minimum: 0
        pokemon:
          type: array
          items:
            $ref: "#/components/schemas/Pokemon"
    ImportPreview:
      type: object
      additionalProperties: false
      required:
        [
          id,
          status,
          source,
          totalRows,
          newCount,
          updatedCount,
          possibleMatchCount,
          possibleMatches,
          invalidRows,
          ignoredColumns,
          unknownFields,
        ]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [staged, committed]
        source:
          type: string
          enum: [poke-genie]
        totalRows:
          type: integer
          minimum: 0
        newCount:
          type: integer
          minimum: 0
          description: Rows that will be added (or were added, once committed).
        updatedCount:
          type: integer
          minimum: 0
          description: Pokémon already collected that get (or got) this import's newer readings.
        possibleMatchCount:
          type: integer
          minimum: 0
          description: Unanswered rows that might be Pokémon already collected; held back.
        possibleMatches:
          type: array
          description: Rows that might be Pokémon already collected, with their answers. Empty once committed.
          items:
            $ref: "#/components/schemas/PossibleMatch"
        invalidRows:
          type: array
          items:
            $ref: "#/components/schemas/InvalidRow"
        ignoredColumns:
          type: array
          description: Columns this importer does not use.
          items:
            type: string
        unknownFields:
          type: array
          description: Features this export cannot establish; they stay unknown.
          items:
            type: string
    PossibleMatch:
      type: object
      additionalProperties: false
      required: [row, incoming, candidates, exact, answer]
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-based line number in the file, counting the header.
        incoming:
          $ref: "#/components/schemas/Pokemon"
        candidates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MatchCandidate"
        exact:
          type: boolean
          description: >-
            One candidate, with species, form, gender, IVs and catch date all
            known and equal. Safe to confirm in bulk.
        answer:
          type: string
          enum: [pending, same, different]
        sameAs:
          type: string
          description: The candidate's pokemon id when the answer is "same".
    MatchCandidate:
      type: object
      additionalProperties: false
      required: [origin, pokemon]
      properties:
        origin:
          type: string
          enum: [collection, import]
          description: A Pokémon already collected, or an earlier row of the same file.
        row:
          type: integer
          minimum: 1
          description: The earlier row's line number, for origin "import".
        pokemon:
          $ref: "#/components/schemas/Pokemon"
    MatchAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/MatchAnswer"
    MatchAnswer:
      type: object
      additionalProperties: false
      required: [row, answer]
      properties:
        row:
          type: integer
          minimum: 1
        answer:
          type: string
          enum: [same, different]
        sameAs:
          type: string
          description: Required when the answer is "same"; a candidate's pokemon id.
    InvalidRow:
      type: object
      additionalProperties: false
      required: [row, message]
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-based line number in the file, counting the header.
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Stable machine-readable code (spec §10.2).
          examples: [VALIDATION_FAILED]
        message:
          type: string
          description: Human-readable explanation for the trainer.
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
          description: Identifier to find the request in host logs.
  responses:
    Error:
      description: Error envelope (spec §10.2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
