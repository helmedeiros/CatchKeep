openapi: 3.1.0
info:
  title: CatchKeep API
  version: 0.1.0
  description: >-
    Profile-scoped API for CatchKeep. Every trainer route derives the trainer
    from the session; trainer IDs never appear in paths or bodies.
servers:
  - url: /api/v1
security: []
tags:
  - name: system
    description: Host status.
  - name: profiles
    description: Trainer profiles on this host.
  - name: session
    description: Signing in to a profile with its PIN.
  - name: imports
    description: Bringing a collection in from an export, previewed before it is applied.
  - name: collection
    description: The signed-in trainer's Pokémon.
  - name: keep
    description: Setup and the keep rules applied to the collection.
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Report whether the API is up.
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /host:
    get:
      tags: [profiles]
      operationId: getHost
      summary: Whether this device is the host admin (the computer running CatchKeep).
      responses:
        "200":
          description: What this device may do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostInfo"
        default:
          $ref: "#/components/responses/Error"
  /autostart:
    get:
      tags: [profiles]
      operationId: getAutostart
      summary: Whether CatchKeep starts when this computer's user logs in.
      description: Only the computer running CatchKeep may ask.
      responses:
        "200":
          description: The current setting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autostart"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [profiles]
      operationId: setAutostart
      summary: Start CatchKeep at login, or stop doing so.
      description: >-
        Only the computer running CatchKeep may change it. It takes effect at
        the next login and starts CatchKeep with the settings it runs with now.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutostartInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Autostart"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: This computer cannot start CatchKeep at login (AUTOSTART_UNSUPPORTED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /profiles:
    get:
      tags: [profiles]
      operationId: listProfiles
      summary: List the profiles on this host, for the profile picker.
      responses:
        "200":
          description: All profiles, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [profiles]
      operationId: createProfile
      summary: Create a trainer profile protected by a PIN.
      description: Only the host admin, on the computer running CatchKeep, may create profiles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProfile"
      responses:
        "201":
          description: Profile created. The caller still has to sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSummary"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /profiles/{profileId}/pin:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProfileId"
    put:
      tags: [profiles]
      operationId: resetPin
      summary: Give a profile a new PIN.
      description: >-
        Only the host admin, on the computer running CatchKeep, may reset PINs. The
        trainer is signed out everywhere and any lockout is lifted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPin"
      responses:
        "204":
          description: The new PIN is set.
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /session:
    post:
      tags: [session]
      operationId: signIn
      summary: Sign in to a profile with its PIN.
      description: >-
        On success sets the session cookie. Signing in while signed in to
        another profile replaces that session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignIn"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The session cookie (`ck_session`), HttpOnly and SameSite=Strict.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [session]
      operationId: signOut
      summary: Sign out of the current profile.
      security:
        - session: []
      responses:
        "204":
          description: Signed out; the session cookie is cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      tags: [session]
      operationId: getMe
      summary: The profile the caller is signed in to.
      security:
        - session: []
      responses:
        "200":
          description: The signed-in profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports:
    post:
      tags: [imports]
      operationId: stageImport
      summary: Upload a Poke Genie CSV export and get a preview. Nothing changes until it is committed.
      security:
        - session: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
      responses:
        "201":
          description: Staged. Review the preview, then commit it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [imports]
      operationId: getImport
      summary: The preview of a staged or committed import.
      security:
        - session: []
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [imports]
      operationId: commitImport
      summary: Add the staged Pokémon to the collection.
      description: >-
        Adds every new row. Rows that might be Pokémon already in the
        collection are held back for review and never merged automatically.
      security:
        - session: []
      responses:
        "200":
          description: Committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}/mapping:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    put:
      tags: [imports]
      operationId: mapImportColumns
      summary: Say which field each column of an unrecognized file holds.
      description: >-
        Reads the staged file with this mapping, replacing any earlier
        mapping and answers, and remembers it so the trainer's next file with
        the same columns is read the same way (V1-IMP-02). Columns left out
        are ignored. One column must hold the species.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnMappingInput"
      responses:
        "200":
          description: Mapped; the preview of the rows read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /imports/{importId}/answers:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [imports]
      operationId: answerPossibleMatches
      summary: Answer whether held-back rows are Pokémon already collected.
      description: >-
        For each row, "same" names the candidate it is (its newer readings are
        added to that Pokémon on commit) and "different" adds it as a new
        Pokémon. A later answer for a row replaces the earlier one. All
        answers are applied, or none.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchAnswers"
      responses:
        "200":
          description: Answers saved; the updated preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /collection:
    get:
      tags: [collection]
      operationId: listCollection
      summary: Every active Pokémon of the signed-in trainer.
      security:
        - session: []
      responses:
        "200":
          description: The collection, strongest first (CP descending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /collection/{pokemonId}/features:
    put:
      tags: [collection]
      operationId: markFeatures
      summary: >-
        Say whether one Pokémon is shiny, lucky, shadow, purified, costumed,
        has a background, or is Dynamax or Gigantamax, as seen in the game.
      description: >-
        The trainer's answer outranks any export, now and on later imports.
        A Pokémon is never both shadow and purified: yes for one is no for the
        other. Features left out keep their current value.
      security:
        - session: []
      parameters:
        - name: pokemonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureMarks"
      responses:
        "200":
          description: Saved; the Pokémon as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pokemon"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /collection/{pokemonId}/protection:
    put:
      tags: [collection]
      operationId: setProtection
      summary: >-
        Protect one Pokémon so it is never suggested for transfer, or remove
        that protection (V1-SET-03).
      security:
        - session: []
      parameters:
        - name: pokemonId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Protection"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Protection"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /collection/confirmations:
    post:
      tags: [collection]
      operationId: confirmAbsent
      summary: Confirm that none of a species' (or any) Pokémon have some features.
      description: >-
        Records the trainer's word, for every Pokémon of one species and form
        (or of the whole collection when neither is given), that the listed
        features are absent. Only unknown values change; features already
        known either way are kept.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbsenceConfirmation"
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmationResult"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /capacity-bands:
    get:
      tags: [keep]
      operationId: getCapacityBands
      summary: How many copies the default keep rules keep for each storage size.
      security:
        - session: []
      responses:
        "200":
          description: The bands, smallest storage first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityBands"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    get:
      tags: [keep]
      operationId: getSetup
      summary: The signed-in trainer's setup.
      security:
        - session: []
      responses:
        "200":
          description: The setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [keep]
      operationId: saveSetup
      summary: Save storage capacity and goals in priority order.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Setup"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setup"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /transfers:
    post:
      tags: [collection]
      operationId: confirmTransfers
      summary: Mark Pokémon as transferred in the game, all or none.
      description: >-
        Refused as a whole when any is already gone (409 ALREADY_TRANSFERRED,
        listing them) or, with planRevision, when the plan is out of date
        (409 STALE_REVISION). The same requestId counts once. It lowers the
        Pokémon-in-the-game count from the setup by as many, if one was
        given; an undo raises it back.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferEvent"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /transfers/{eventId}/undo:
    post:
      tags: [collection]
      operationId: undoTransfer
      summary: Put the Pokémon of a transfer back in CatchKeep.
      description: It cannot bring back a Pokémon transferred in the game.
      security:
        - session: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The undo, recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferEvent"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /history:
    get:
      tags: [collection]
      operationId: getHistory
      summary: The latest transfers and undos, newest first.
      security:
        - session: []
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /plan:
    get:
      tags: [keep]
      operationId: getPlan
      summary: Suggest which Pokémon to transfer to make the room asked for.
      description: >-
        The possible transfers, least valuable first (lowest IV total, then
        CP, then oldest catch), up to the target, each verified against the
        keep rules (spec §7). Nothing changes until the trainer transfers in
        the game.
      security:
        - session: []
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TargetKind"
        - name: value
          in: query
          required: false
          description: Slots or percent; not used for limit.
          schema:
            type: integer
            minimum: 1
            maximum: 20000
      responses:
        "200":
          description: The suggested cleanup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Storage and goals are not set up yet (SETUP_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /species-rules:
    get:
      tags: [keep]
      operationId: getSpeciesRules
      summary: The trainer's per-species keep rules.
      security:
        - session: []
      responses:
        "200":
          description: The species rules; empty until the trainer sets one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesRules"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [keep]
      operationId: saveSpeciesRules
      summary: >-
        Replace the per-species keep rules. They replace the generated
        minimums for their species (V1-RUL-04).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesRules"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesRules"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Storage and goals are not set up yet (SETUP_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /category-rules:
    get:
      tags: [keep]
      operationId: getCategoryRules
      summary: The trainer's keep rules for legendary, mythical and Ultra Beast species.
      security:
        - session: []
      responses:
        "200":
          description: The category rules; empty until the trainer sets one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryRules"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [keep]
      operationId: saveCategoryRules
      summary: >-
        Replace the category keep rules. Each applies to every species in
        its category as that species' own rule would, unless the species
        has its own rule (OD-02).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRules"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryRules"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Storage and goals are not set up yet (SETUP_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /teams:
    get:
      tags: [keep]
      operationId: listTeams
      summary: The trainer's teams by name. Every member is protected.
      security:
        - session: []
      responses:
        "200":
          description: The teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teams"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [keep]
      operationId: createTeam
      summary: Create a named team (V1-SET-03).
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Another team has that name (TEAM_NAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /teams/{teamId}:
    parameters:
      - name: teamId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [keep]
      operationId: updateTeam
      summary: Rename a team and replace its members.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Another team has that name (TEAM_NAME_TAKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [keep]
      operationId: deleteTeam
      summary: Delete a team; its members lose that protection.
      security:
        - session: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /keep-summary:
    get:
      tags: [keep]
      operationId: getKeepSummary
      summary: What the keep rules do with the collection.
      description: >-
        Kept, surplus (beyond the rules; possible transfers) and Pokémon
        waiting for confirmation of unknown features add up to the total.
        Returns 409 SETUP_REQUIRED until the trainer has saved a setup.
      security:
        - session: []
      responses:
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeepSummary"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ck_session
  schemas:
    ProfileId:
      type: string
      description: Stable profile identifier (ULID).
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      examples: [01JD2Z8Q4M8V7Y6X5W4T3S2R1P]
    DisplayName:
      type: string
      minLength: 1
      maxLength: 40
      examples: [Ash]
    Pin:
      type: string
      description: 4 to 8 digits.
      pattern: "^[0-9]{4,8}$"
      examples: ["2468"]
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: "#/components/schemas/ProfileId"
        displayName:
          $ref: "#/components/schemas/DisplayName"
    NewProfile:
      type: object
      additionalProperties: false
      required: [displayName, pin]
      properties:
        displayName:
          $ref: "#/components/schemas/DisplayName"
        pin:
          $ref: "#/components/schemas/Pin"
    Autostart:
      type: object
      additionalProperties: false
      required: [supported, enabled]
      properties:
        supported:
          type: boolean
          description: This computer can start CatchKeep at login (macOS).
        enabled:
          type: boolean
    AutostartInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
    HostInfo:
      type: object
      additionalProperties: false
      required: [admin, addresses]
      properties:
        admin:
          type: boolean
          description: >-
            This request comes from the computer running CatchKeep, which may
            create profiles and reset PINs.
        addresses:
          type: array
          description: >-
            Web addresses other devices on the network can open to reach
            CatchKeep. Only told to the computer running it; empty when
            CatchKeep only listens on that computer.
          items:
            type: string
            examples: ["http://192.168.1.20:8080"]
    NewPin:
      type: object
      additionalProperties: false
      required: [pin]
      properties:
        pin:
          $ref: "#/components/schemas/Pin"
    SignIn:
      type: object
      additionalProperties: false
      required: [profileId, pin]
      properties:
        profileId:
          $ref: "#/components/schemas/ProfileId"
        pin:
          $ref: "#/components/schemas/Pin"
    Me:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: "#/components/schemas/ProfileId"
        displayName:
          $ref: "#/components/schemas/DisplayName"
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Backend build version.
          examples: [0.1.0]
    TriState:
      type: string
      description: >-
        Whether a feature is known to be present, known to be absent, or not
        established by any source yet. Unknown is never treated as absent.
      enum: [yes, no, unknown]
    Pokemon:
      type: object
      additionalProperties: false
      required: [id, species, form, protected, attributes]
      properties:
        id:
          type: string
          description: >-
            Stable record id (ULID). A row of an import that is not collected
            yet has the id "row-N".
        species:
          type: string
          examples: [Metagross]
        form:
          type: string
          description: Form name; "Normal" for the default form.
          examples: [Normal]
        dexNumber:
          type: integer
          minimum: 1
        protected:
          type: boolean
          description: The trainer protected it, so it is never transferred.
        gender:
          type: string
          enum: [male, female]
        cp:
          type: integer
          minimum: 0
        hp:
          type: integer
          minimum: 0
        level:
          type: number
        iv:
          $ref: "#/components/schemas/IVs"
        catchDate:
          type: string
          format: date
        attributes:
          $ref: "#/components/schemas/Attributes"
    IVs:
      type: object
      additionalProperties: false
      required: [attack, defense, stamina]
      properties:
        attack:
          type: integer
          minimum: 0
          maximum: 15
        defense:
          type: integer
          minimum: 0
          maximum: 15
        stamina:
          type: integer
          minimum: 0
          maximum: 15
    Attributes:
      type: object
      additionalProperties: false
      required:
        [
          shiny,
          lucky,
          shadow,
          purified,
          favorite,
          costume,
          background,
          dynamax,
          gigantamax,
        ]
      properties:
        shiny:
          $ref: "#/components/schemas/TriState"
        lucky:
          $ref: "#/components/schemas/TriState"
        shadow:
          $ref: "#/components/schemas/TriState"
        purified:
          $ref: "#/components/schemas/TriState"
        favorite:
          $ref: "#/components/schemas/TriState"
        costume:
          $ref: "#/components/schemas/TriState"
        background:
          $ref: "#/components/schemas/TriState"
        dynamax:
          $ref: "#/components/schemas/TriState"
        gigantamax:
          $ref: "#/components/schemas/TriState"
    Collection:
      type: object
      additionalProperties: false
      required: [total, pokemon]
      properties:
        total:
          type: integer
          minimum: 0
        pokemon:
          type: array
          items:
            $ref: "#/components/schemas/Pokemon"
    ImportPreview:
      type: object
      additionalProperties: false
      required:
        [
          id,
          status,
          source,
          totalRows,
          newCount,
          updatedCount,
          possibleMatchCount,
          possibleMatches,
          invalidRows,
          ignoredColumns,
          unknownFields,
          needsMapping,
          columns,
          mapping,
        ]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [staged, committed]
        source:
          type: string
          enum: [poke-genie, csv]
          description: >-
            poke-genie for a recognized export; csv for any other file, read
            with a column mapping.
        totalRows:
          type: integer
          minimum: 0
        newCount:
          type: integer
          minimum: 0
          description: Rows that will be added (or were added, once committed).
        updatedCount:
          type: integer
          minimum: 0
          description: Pokémon already collected that get (or got) this import's newer readings.
        possibleMatchCount:
          type: integer
          minimum: 0
          description: Unanswered rows that might be Pokémon already collected; held back.
        possibleMatches:
          type: array
          description: Rows that might be Pokémon already collected, with their answers. Empty once committed.
          items:
            $ref: "#/components/schemas/PossibleMatch"
        invalidRows:
          type: array
          items:
            $ref: "#/components/schemas/InvalidRow"
        ignoredColumns:
          type: array
          description: Columns this importer does not use.
          items:
            type: string
        unknownFields:
          type: array
          description: Features this export cannot establish; they stay unknown.
          items:
            type: string
        needsMapping:
          type: boolean
          description: >-
            The file is not a recognized export and its columns are not
            mapped yet; nothing is read and it cannot be committed until
            they are.
        columns:
          type: array
          description: The columns of an unrecognized file with a few values each; empty for a recognized export.
          items:
            $ref: "#/components/schemas/ImportColumn"
        mapping:
          type: array
          description: >-
            How an unrecognized file's columns are mapped, or a suggestion
            from their names while it still needs mapping.
          items:
            $ref: "#/components/schemas/ColumnMapEntry"
    ImportColumn:
      type: object
      additionalProperties: false
      required: [name, samples]
      properties:
        name:
          type: string
        samples:
          type: array
          maxItems: 3
          items:
            type: string
    ColumnMapEntry:
      type: object
      additionalProperties: false
      required: [column, field]
      properties:
        column:
          type: string
        field:
          $ref: "#/components/schemas/MappableField"
    ColumnMappingInput:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ColumnMapEntry"
    MappableField:
      type: string
      enum:
        [
          species,
          dex_number,
          form,
          gender,
          cp,
          hp,
          level,
          iv_attack,
          iv_defense,
          iv_stamina,
          catch_date,
          shiny,
          lucky,
          shadow,
          purified,
          costume,
          background,
          dynamax,
          gigantamax,
          in_game_favorite,
        ]
    PossibleMatch:
      type: object
      additionalProperties: false
      required: [row, incoming, candidates, exact, answer]
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-based line number in the file, counting the header.
        incoming:
          $ref: "#/components/schemas/Pokemon"
        candidates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MatchCandidate"
        exact:
          type: boolean
          description: >-
            One candidate, with species, form, gender, IVs and catch date all
            known and equal (genderless on both sides counts as equal). Safe
            to confirm in bulk.
        answer:
          type: string
          enum: [pending, same, different]
        sameAs:
          type: string
          description: The candidate's pokemon id when the answer is "same".
    MatchCandidate:
      type: object
      additionalProperties: false
      required: [origin, pokemon]
      properties:
        origin:
          type: string
          enum: [collection, import]
          description: A Pokémon already collected, or an earlier row of the same file.
        row:
          type: integer
          minimum: 1
          description: The earlier row's line number, for origin "import".
        pokemon:
          $ref: "#/components/schemas/Pokemon"
    MatchAnswers:
      type: object
      additionalProperties: false
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            $ref: "#/components/schemas/MatchAnswer"
    MatchAnswer:
      type: object
      additionalProperties: false
      required: [row, answer]
      properties:
        row:
          type: integer
          minimum: 1
        answer:
          type: string
          enum: [same, different]
        sameAs:
          type: string
          description: Required when the answer is "same"; a candidate's pokemon id.
    AbsenceConfirmation:
      type: object
      additionalProperties: false
      required: [features]
      description: Give species and form together, or neither for the whole collection.
      properties:
        species:
          type: string
          minLength: 1
          examples: [Pidgey]
        form:
          type: string
          minLength: 1
          examples: [Normal]
        features:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ConfirmableFeature"
    ConfirmableFeature:
      type: string
      enum: [shiny, costume, background, dynamax, gigantamax]
    ConfirmationResult:
      type: object
      additionalProperties: false
      required: [updated]
      properties:
        updated:
          type: integer
          minimum: 0
          description: Pokémon that had at least one of the features unknown.
    Setup:
      type: object
      additionalProperties: false
      required: [capacity, goals]
      properties:
        capacity:
          type: integer
          minimum: 1
          maximum: 20000
          description: Pokémon storage slots.
          examples: [2700]
        goals:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: Goals, most important first.
          items:
            type: string
            enum: [collecting, trading, battling]
        inGameCount:
          type: integer
          minimum: 0
          maximum: 20000
          description: >-
            How many Pokémon the game shows the trainer has; 0 or absent when
            not given, and the imported count is used as an estimate.
        limit:
          type: integer
          minimum: 50
          maximum: 100
          description: Percent of storage to stay under; absent means 80.
    TargetKind:
      type: string
      enum: [limit, free_more, reach_free, percent]
      description: >-
        limit gets back under the storage limit; free_more frees value more
        slots; reach_free reaches value free slots; percent frees value
        percent of the Pokémon in storage.
    Plan:
      type: object
      additionalProperties: false
      required:
        [
          use,
          kind,
          wanted,
          maxFeasible,
          shortfall,
          favorites,
          favoritesUnknown,
          transfers,
          searches,
          revision,
        ]
      properties:
        use:
          $ref: "#/components/schemas/StorageUse"
        kind:
          $ref: "#/components/schemas/TargetKind"
        value:
          type: integer
        wanted:
          type: integer
          minimum: 0
          description: How many to transfer for the target.
        maxFeasible:
          type: integer
          minimum: 0
          description: How many the keep rules allow to transfer.
        shortfall:
          type: integer
          minimum: 0
          description: How many short of the target, when the rules allow fewer.
        favorites:
          type: integer
          minimum: 0
          description: Suggestions starred in the game; unstar them first.
        favoritesUnknown:
          type: integer
          minimum: 0
          description: Suggestions whose star the export could not tell.
        transfers:
          type: array
          items:
            $ref: "#/components/schemas/PlanItem"
        revision:
          type: integer
          format: int64
          description: Send it back when confirming the plan, so a plan made before a change is refused.
        searches:
          type: array
          description: One Pokémon GO search per species, in plan order (V1-CLN-04).
          items:
            $ref: "#/components/schemas/SpeciesSearch"
    TransferInput:
      type: object
      additionalProperties: false
      required: [pokemonIds, requestId]
      properties:
        pokemonIds:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
        requestId:
          type: string
          minLength: 1
          maxLength: 100
          description: Chosen by the client; repeating it returns the same transfer.
        planRevision:
          type: integer
          format: int64
          description: The revision of the plan being confirmed, if any.
    TransferEvent:
      type: object
      additionalProperties: false
      required: [id, kind, at, pokemon]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [single, bulk, undo]
        at:
          type: string
          format: date-time
        pokemon:
          type: array
          items:
            $ref: "#/components/schemas/TransferredPokemon"
        undoes:
          type: string
          description: For an undo, the transfer it reverses.
        undoneBy:
          type: string
          description: For a transfer that was undone, the undo.
    TransferredPokemon:
      type: object
      additionalProperties: false
      required: [id, species]
      properties:
        id:
          type: string
        species:
          type: string
        cp:
          type: integer
    History:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TransferEvent"
    SpeciesSearch:
      type: object
      additionalProperties: false
      required: [species, query, pokemonIds, collisions, items]
      properties:
        species:
          type: string
        query:
          type: string
          description: >-
            Finds every planned Pokémon of this species in the game, e.g.
            "16&cp90,cp120"; empty when the Pokédex number is not known.
          examples: ["16&cp90,cp120"]
        pokemonIds:
          type: array
          items:
            type: string
        collisions:
          type: array
          description: Pokémon to keep that the query would also find.
          items:
            type: string
        items:
          type: array
          description: Narrower searches for planned Pokémon that share a CP with one to keep.
          items:
            $ref: "#/components/schemas/ItemSearch"
    ItemSearch:
      type: object
      additionalProperties: false
      required: [pokemonId, query, collisions]
      properties:
        pokemonId:
          type: string
        query:
          type: string
          description: A narrower search, or empty when the species search finds it alone.
        collisions:
          type: array
          description: Pokémon even the narrower search finds; check them in the game.
          items:
            type: string
    StorageUse:
      type: object
      additionalProperties: false
      required: [capacity, occupied, free, estimated, limit]
      properties:
        capacity:
          type: integer
        occupied:
          type: integer
        free:
          type: integer
        estimated:
          type: boolean
          description: Occupied counts imported Pokémon because no in-game count was given.
        limit:
          type: integer
          description: Slots the trainer wants to stay under.
    PlanItem:
      type: object
      additionalProperties: false
      required: [pokemonId, keptInGroup, rule, favorite]
      properties:
        pokemonId:
          type: string
        keptInGroup:
          type: integer
          minimum: 0
          description: Copies of its variant that stay.
        rule:
          type: string
          enum: [default, rare, category, species, favorite]
        favorite:
          $ref: "#/components/schemas/TriState"
    Teams:
      type: object
      additionalProperties: false
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
    Team:
      type: object
      additionalProperties: false
      required: [id, name, memberIds]
      properties:
        id:
          type: string
        name:
          type: string
          examples: [Raid Kyurem]
        memberIds:
          type: array
          description: Members in the trainer's order.
          items:
            type: string
    TeamInput:
      type: object
      additionalProperties: false
      required: [name, memberIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        memberIds:
          type: array
          maxItems: 100
          items:
            type: string
    FeatureMarks:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        shiny:
          type: boolean
        lucky:
          type: boolean
        shadow:
          type: boolean
        purified:
          type: boolean
        costume:
          type: boolean
        background:
          type: boolean
        dynamax:
          type: boolean
        gigantamax:
          type: boolean
    Protection:
      type: object
      additionalProperties: false
      required: [protected]
      properties:
        protected:
          type: boolean
    SpeciesRules:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/SpeciesRule"
    SpeciesRule:
      type: object
      additionalProperties: false
      required: [species, minimum, favorite]
      properties:
        species:
          type: string
          examples: [Kyurem]
        minimum:
          type: integer
          minimum: 0
          maximum: 20000
          description: >-
            Copies kept across all variants of the species; 0 when only a
            favorite.
        favorite:
          type: boolean
          description: A favorite species keeps every copy.
    SpeciesCategory:
      type: string
      enum: [legendary, mythical, ultra-beast]
    CategoryRules:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CategoryRule"
    CategoryRule:
      type: object
      additionalProperties: false
      required: [category, minimum, favorite]
      properties:
        category:
          $ref: "#/components/schemas/SpeciesCategory"
        minimum:
          type: integer
          minimum: 0
          maximum: 20000
          description: >-
            Copies kept across all variants of each species in the category;
            0 when only a favorite.
        favorite:
          type: boolean
          description: Every copy of every species in the category is kept.
    KeepSummary:
      type: object
      additionalProperties: false
      required:
        [
          total,
          kept,
          surplus,
          needsConfirmation,
          protected,
          minimum,
          rareMinimum,
          groups,
        ]
      properties:
        total:
          type: integer
          minimum: 0
        kept:
          type: integer
          minimum: 0
        surplus:
          type: integer
          minimum: 0
          description: Pokémon beyond the keep rules; possible transfers.
        needsConfirmation:
          type: integer
          minimum: 0
          description: Kept until unknown features (shiny, costume…) are confirmed.
        protected:
          type: integer
          minimum: 0
          description: Kept Pokémon the trainer protected.
        minimum:
          type: integer
          minimum: 1
          description: Copies of each variant kept by default for this capacity.
        rareMinimum:
          type: integer
          minimum: 1
          description: >-
            Copies of each variant of a legendary, mythical or Ultra Beast
            species kept by default for this capacity.
        groups:
          type: array
          description: One per fully known variant, largest surplus first.
          items:
            $ref: "#/components/schemas/VariantGroup"
    CapacityBands:
      type: object
      additionalProperties: false
      required: [bands]
      properties:
        bands:
          type: array
          items:
            $ref: "#/components/schemas/CapacityBand"
    CapacityBand:
      type: object
      additionalProperties: false
      required: [upTo, ordinary, rare]
      properties:
        upTo:
          type: integer
          minimum: 1
          description: Largest storage, in slots, this band covers.
        ordinary:
          type: integer
          minimum: 1
          description: Copies kept of each variant.
        rare:
          type: integer
          minimum: 1
          description: Copies kept of each variant of a rare species.
    VariantGroup:
      type: object
      additionalProperties: false
      required:
        [
          species,
          form,
          shiny,
          costume,
          background,
          dynamax,
          gigantamax,
          lucky,
          shadow,
          purified,
          rare,
          default,
          tradeBonus,
          rule,
          count,
          minimum,
          keep,
          keptIds,
          surplusIds,
          protectedIds,
        ]
      properties:
        species:
          type: string
        form:
          type: string
        shiny:
          type: boolean
        costume:
          type: boolean
        background:
          type: boolean
        dynamax:
          type: boolean
        gigantamax:
          type: boolean
        lucky:
          type: boolean
        shadow:
          type: boolean
        purified:
          type: boolean
        rare:
          type: boolean
          description: Legendary, mythical or Ultra Beast species.
        category:
          $ref: "#/components/schemas/SpeciesCategory"
        default:
          type: integer
          minimum: 1
          description: >-
            Minimum generated from storage and goals, before any species rule
            or favorite replaced it.
        tradeBonus:
          type: boolean
          description: The trading goal added one to the generated minimum.
        rule:
          type: string
          enum: [default, rare, category, species, favorite]
          description: The rule that decided this group's minimum.
        count:
          type: integer
          minimum: 1
        minimum:
          type: integer
          minimum: 1
        keep:
          type: integer
          minimum: 0
        keptIds:
          type: array
          description: Pokémon the rules keep, best first.
          items:
            type: string
        surplusIds:
          type: array
          description: Pokémon beyond the minimum, best first.
          items:
            type: string
        protectedIds:
          type: array
          description: Kept copies the trainer protected.
          items:
            type: string
    InvalidRow:
      type: object
      additionalProperties: false
      required: [row, message]
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-based line number in the file, counting the header.
        message:
          type: string
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
          description: Stable machine-readable code (spec §10.2).
          examples: [VALIDATION_FAILED]
        message:
          type: string
          description: Human-readable explanation for the trainer.
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
